# HTTP-only variant for first bring-up by IP address (no domain/certificate yet).
# Switch to nocturne.conf (HTTPS) once you have a domain, and set Auth__SecureCookies=true on the API.
upstream nocturne_web { server 127.0.0.1:3000; keepalive 16; }
upstream nocturne_api { server API_PRIVATE_IP:5000; keepalive 16; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://nocturne_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /swagger { return 404; }
    location / {
        proxy_pass http://nocturne_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
