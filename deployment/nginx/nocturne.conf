# /etc/nginx/conf.d/nocturne.conf  (Web EC2 — public subnet)
# Replace example.com and API_PRIVATE_IP (private IP / DNS name of the API EC2). Certificates: certbot --nginx -d example.com -d www.example.com

limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/m;

upstream nocturne_web { server 127.0.0.1:3000; keepalive 16; }
upstream nocturne_api { server API_PRIVATE_IP:5000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 6m;          # image uploads (API enforces 5 MB)
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- API: same origin, forwarded over the private network to EC2 #2 ----
    location /api/ {
        proxy_pass http://nocturne_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # tighter limit on credential endpoints (the API also rate-limits)
    location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://nocturne_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Swagger is never exposed publicly.
    location /swagger { return 404; }

    # ---- Next.js (localhost:3000, not exposed) ----
    location / {
        proxy_pass http://nocturne_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
